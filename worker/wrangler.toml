name = "term-roulette-api"
main = "src/index.js"
compatibility_date = "2024-08-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Comma-separated origins allowed to call this worker (your GitHub Pages URL + localhost).
ALLOWED_ORIGINS = "https://denyslentsov.github.io,http://localhost:8766,http://127.0.0.1:8766"
